# Standalone install. The @rulecanvas packages are not on the npm registry, so every
# reference to them (including the ones inside each package) resolves to the local
# tarballs written by `pnpm run pack:local` in the RuleCanvasKit repository.
overrides:
  '@rulecanvas/core': file:../rulecanvas-tarballs/rulecanvas-core-0.1.0.tgz
  '@rulecanvas/ui': file:../rulecanvas-tarballs/rulecanvas-ui-0.2.0.tgz
  '@rulecanvas/workbench': file:../rulecanvas-tarballs/rulecanvas-workbench-0.5.0.tgz
  '@rulecanvas/workbench-react': file:../rulecanvas-tarballs/rulecanvas-workbench-react-0.7.0.tgz
allowBuilds:
  esbuild: true
