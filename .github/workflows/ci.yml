name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages and both applications
        run: pnpm build

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Strict ES2022 core typecheck
        run: pnpm --filter @rulecanvas/core exec tsc --noEmit -p tsconfig.json

      - name: Strict ES2022 UI typecheck
        run: pnpm --filter @rulecanvas/ui exec tsc --noEmit -p tsconfig.json

      - name: Strict ES2022 workbench typecheck
        run: pnpm --filter @rulecanvas/workbench exec tsc --noEmit -p tsconfig.json

      - name: Strict React workbench adapter typecheck
        run: pnpm --filter @rulecanvas/workbench-react exec tsc --noEmit -p tsconfig.json

      - name: Verify public package exports
        run: pnpm verify:exports

      - name: Verify package archives and third-app consumer
        env:
          PACK_ARCHIVE_DIR: ${{ runner.temp }}/rulecanvas-archives-${{ github.sha }}
          BOOKING_FIXTURE_DIST: ${{ runner.temp }}/rulecanvas-booking-${{ github.sha }}
        run: pnpm verify:pack

      - name: Run unit, property, replay, and scenario tests
        run: pnpm test

      - name: Run deterministic seeded property-based tests
        run: FC_SEED=918273645 pnpm --filter @rulecanvas/core exec vitest run tests/properties.test.ts

      - name: Verify architecture boundaries
        run: pnpm verify:boundaries

      - name: Enforce anti-skip test hygiene
        run: pnpm verify:hygiene

      - name: Verify workspace configuration tracking
        run: |
          git ls-files --error-unmatch \
            .kiro/hooks/verify-core.json \
            .kiro/specs/README.md \
            .kiro/steering/architecture-boundaries.md \
            .kiro/steering/engine-correctness.md >/dev/null
          for p in .kiro .kiro/specs .kiro/steering .kiro/hooks; do
            rc=0
            git check-ignore -q "$p" || rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "ERROR: $p is git-ignored or check-ignore failed (rc=$rc)" >&2
              exit 1
            fi
          done

      - name: Run deterministic benchmark suite
        run: pnpm bench

      - name: Install Playwright Chromium for browser E2E gate
        run: |
          mkdir -p "${{ runner.temp }}/pw"
          npm install --no-save --prefix "${{ runner.temp }}/pw" playwright@1.65.1 @axe-core/playwright@4.14.1
          "${{ runner.temp }}/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run Playwright browser regression gate
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
          AXE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/@axe-core/playwright/dist/index.mjs
          SCREENSHOT_DIR: ${{ runner.temp }}/rulecanvas-screenshots-${{ github.sha }}
          BOOKING_FIXTURE_DIST: ${{ runner.temp }}/rulecanvas-booking-${{ github.sha }}
        run: pnpm test:browser

      - name: Archive independently deployable production builds
        env:
          ARCHIVE_DIR: ${{ runner.temp }}/rulecanvas-archives-${{ github.sha }}
        run: |
          for app in agent-gate interlock-sim; do
            tar -czf "$ARCHIVE_DIR/$app-static.tar.gz" -C "apps/$app/dist" .
          done
          cd "$ARCHIVE_DIR"
          sha256sum agent-gate-static.tar.gz interlock-sim-static.tar.gz >> SHA256SUMS.txt

      - name: Upload commit-scoped browser screenshots and archives
        uses: actions/upload-artifact@v4
        with:
          name: phase6-release-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rulecanvas-screenshots-${{ github.sha }}
            ${{ runner.temp }}/rulecanvas-archives-${{ github.sha }}
          retention-days: 14
