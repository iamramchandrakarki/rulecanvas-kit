<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AgentGate is a discrete finite-state policy verification workbench for analyzing approval-laundering invariants and shortest counterexample traces."

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231c4ed8'/%3E%3Crect x='5' y='5' width='22' height='22' rx='2' fill='none' stroke='%23f8fafc' stroke-width='2'/%3E%3Ccircle cx='11' cy='11' r='2.5' fill='%23f8fafc'/%3E%3Ccircle cx='21' cy='11' r='2.5' fill='none' stroke='%23f8fafc' stroke-width='2'/%3E%3Ccircle cx='21' cy='21' r='2.5' fill='%23f8fafc'/%3E%3Cpath d='M13.5 11h5M21 13.5v5M12.8 12.8l6.4 6.4' stroke='%23f8fafc' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>AgentGate: Discrete Policy Verification Workbench</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('rulecanvas-theme');
          var pref = raw === 'light' || raw === 'dark' || raw === 'system' ? raw : 'system';
          var sysDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = pref === 'dark' || (pref === 'system' && sysDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-preference', pref);
          document.documentElement.style.colorScheme = resolved;
        } catch (_e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
