<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="InterlockSim is an educational discrete-state BSL-3 bio-containment airlock safety interlock simulation and bounded model-checking workbench."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231c4ed8'/%3E%3Crect x='4' y='6' width='24' height='20' rx='2' fill='none' stroke='%23f8fafc' stroke-width='2'/%3E%3Cline x1='11' y1='6' x2='11' y2='26' stroke='%23f8fafc' stroke-width='2'/%3E%3Cline x1='21' y1='6' x2='21' y2='26' stroke='%23f8fafc' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23f8fafc'/%3E%3C/svg%3E"
    />
    <title>InterlockSim: Discrete BSL-3 Airlock Interlock Workbench</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('rulecanvas-theme');
          var pref = raw === 'light' || raw === 'dark' || raw === 'system' ? raw : 'system';
          var sysDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = pref === 'dark' || (pref === 'system' && sysDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-preference', pref);
          document.documentElement.style.colorScheme = resolved;
        } catch (_e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
